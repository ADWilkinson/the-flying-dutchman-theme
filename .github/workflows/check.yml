name: Check themes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Runtime advisories gate the build; the extension ships no runtime dependencies,
      # and dev-only advisories are reported by the weekly audit digest instead.
      - run: bun audit --prod
      - run: bun test
      - run: bun run check:themes
