name: Check themes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime advisories gate the build; the extension ships no npm dependencies,
      # and dev-only advisories are reported by the weekly audit digest instead.
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run check:themes
